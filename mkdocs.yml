site_name: termcraft
site_description: Terminal Reborn development guide — 2D sandbox survival, terminal pixel art and co-op over SSH.
site_url: https://pagel-s.github.io/termcraft/
repo_url: https://github.com/pagel-s/termcraft
repo_name: pagel-s/termcraft

docs_dir: docs
site_dir: site

nav:
  - Home: index.md
  - Installation: installation.md
  - Gameplay: gameplay.md
  - Co-op: multiplayer.md
  - Native Archives and SSH: distribution.md
  - Release Notes: https://github.com/pagel-s/termcraft/blob/beta/terminal-reborn/RELEASE_NOTES.md
  - Supported Content: supported-content.md
  - Media Credits: media-credits.md
  - Saving and Recovery: world-format.md

theme:
  name: readthedocs

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - fenced_code
  - toc:
      permalink: true

strict: true
