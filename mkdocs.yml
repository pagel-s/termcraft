site_name: termcraft
site_description: Early-alpha terminal-first 2D sandbox game with a classic survival arc.
site_url: https://pagel-s.github.io/termcraft/
repo_url: https://github.com/pagel-s/termcraft
repo_name: pagel-s/termcraft

docs_dir: docs
site_dir: site

# These are GitHub's image-gallery fallbacks; the site serves each index.html.
exclude_docs: |
  design/world-atlas-2026-10-15/README.md
  design/world-refinement-2026-10-15/README.md

nav:
  - Home: index.md
  - Installation: installation.md
  - Gameplay: gameplay.md
  - Movement and art review: feel-and-art.md
  - Agents and Generated Worlds: agents.md
  - Experimental Local Co-op: multiplayer.md
  - Development Distribution and SSH: distribution.md
  - Next Beta (Development Draft): beta-release-notes.md
  - Supported Content: supported-content.md
  - Media Credits: media-credits.md
  - World Format: world-format.md
  - Performance and Foundation Checks: performance.md
  - Developer: developer.md

theme:
  name: readthedocs

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - fenced_code
  - toc:
      permalink: true

strict: true
