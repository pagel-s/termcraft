name: Native artifacts

on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      source_ref:
        description: Existing source ref to qualify (blank uses the selected branch)
        type: string
        default: ''
  push:
    branches: ['main', 'beta/**']
    paths:
      - '.github/workflows/native-artifacts.yml'
      - 'src/**'
      - 'tests/**'
      - 'docs/**'
      - 'hosting/**'
      - 'README.md'
      - 'README-crates.md'
      - 'RELEASE_NOTES.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/package_release.py'
      - 'scripts/distribution.py'
      - 'scripts/check_distribution.py'
      - 'scripts/test_distribution.py'
      - 'tests/fixtures/winget-schema-1.10.0/**'
      - 'scripts/test_native_archive.py'
      - 'scripts/test_storage_recovery.py'
      - 'scripts/storage_faults.c'
      - 'scripts/test_terminal_input.py'
      - 'scripts/test_player_chat.py'
      - 'scripts/test_host_input.py'
      - 'scripts/test_network_catchup.py'
      - 'scripts/test_hosting_launcher.py'
      - 'scripts/test_sandbox_server.py'
      - 'scripts/test_inventory_input.py'
      - 'scripts/test_drop_input.py'
      - 'scripts/test_furnace_input.py'
      - 'scripts/test_finale_input.py'
      - 'scripts/test_terminal_views.py'
      - 'scripts/capture_terminal_art.py'
      - 'scripts/test_ssh_join.py'

concurrency:
  group: native-artifacts-${{ github.ref }}-${{ inputs.source_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read package version
        id: package
        run: python -c "import os, pathlib, tomllib; version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']; pathlib.Path(os.environ['GITHUB_OUTPUT']).write_text('version=' + version + '\n', encoding='utf-8')"
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy
      - name: Verify
        run: cargo +1.88.0 test --locked
      - name: Real loopback co-op and live MCP
        if: runner.os != 'Windows'
        run: |
          cargo +1.88.0 test --locked --lib temporary_socket -- --ignored
          cargo +1.88.0 test --locked --test multiplayer_tcp -- --ignored
      - name: Strict Clippy
        run: cargo +1.88.0 clippy --all-targets --locked -- -D warnings
      - name: Build native binary
        run: cargo +1.88.0 build --release --locked --target ${{ matrix.target }}
      - name: Install SSH and native recovery test dependencies (Linux)
        if: runner.os == 'Linux'
        run: python -m pip install paramiko==5.0.0 pillow==12.1.1
      - name: Check walking, sprinting and pixel views in live terminals (Linux)
        if: runner.os == 'Linux'
        run: |
          python scripts/test_host_input.py --binary target/${{ matrix.target }}/release/termcraft --report host-qualification.json
          python scripts/test_network_catchup.py --binary target/${{ matrix.target }}/release/termcraft --report network-catchup-qualification.json
          python scripts/test_player_chat.py --binary target/${{ matrix.target }}/release/termcraft --report player-chat-qualification.json
          python scripts/test_terminal_input.py --binary target/${{ matrix.target }}/release/termcraft --report terminal-input-qualification.json
          python scripts/test_terminal_views.py --binary target/${{ matrix.target }}/release/termcraft --report terminal-views-qualification.json
          cargo +1.88.0 build --locked --example interaction_review
          python scripts/test_inventory_input.py --binary target/${{ matrix.target }}/release/termcraft --fixture target/debug/examples/interaction_review --report inventory-qualification.json
          cargo +1.88.0 build --locked --example encounter_review
          python scripts/test_finale_input.py --binary target/${{ matrix.target }}/release/termcraft --fixture target/debug/examples/encounter_review --report finale-qualification.json
          python scripts/test_furnace_input.py --binary target/${{ matrix.target }}/release/termcraft --fixture target/debug/examples/interaction_review --report furnace-qualification.json
          python scripts/test_drop_input.py --binary target/${{ matrix.target }}/release/termcraft --fixture target/debug/examples/interaction_review --report drop-qualification.json
      - name: Check storage faults and recover into a backup copy (Linux)
        if: runner.os == 'Linux'
        run: python scripts/test_storage_recovery.py --binary target/${{ matrix.target }}/release/termcraft --native-recovery --report storage-qualification.json
      - name: Real OpenSSH transport and rendered join (Linux)
        if: runner.os == 'Linux'
        run: python scripts/test_ssh_join.py --binary target/${{ matrix.target }}/release/termcraft --report ssh-qualification.json
      - name: Package Unix
        if: runner.os != 'Windows'
        run: python scripts/package_release.py --binary target/${{ matrix.target }}/release/termcraft --target ${{ matrix.target }} --output dist
      - name: Package Windows
        if: runner.os == 'Windows'
        run: python scripts/package_release.py --binary target/${{ matrix.target }}/release/termcraft.exe --target ${{ matrix.target }} --output dist
      - name: Extract and run archive without Rust in PATH
        timeout-minutes: 3
        run: python scripts/test_native_archive.py --directory dist --report native-qualification.json
      - uses: actions/upload-artifact@v4
        with:
          name: termcraft-${{ steps.package.outputs.version }}-${{ matrix.target }}
          path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: native-qualification-${{ matrix.target }}
          path: native-qualification.json
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: storage-qualification-linux
          path: storage-qualification.json
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: ssh-qualification-${{ matrix.target }}
          path: ssh-qualification.json
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: terminal-qualification-${{ matrix.target }}
          path: |
            host-qualification.json
            network-catchup-qualification.json
            player-chat-qualification.json
            terminal-input-qualification.json
            terminal-views-qualification.json
            inventory-qualification.json
            furnace-qualification.json
            finale-qualification.json
            drop-qualification.json

  sandbox-hosting:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read package version
        id: package
        run: python -c "import os, pathlib, tomllib; version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']; pathlib.Path(os.environ['GITHUB_OUTPUT']).write_text('version=' + version + '\n', encoding='utf-8')"
      - uses: actions/download-artifact@v4
        with:
          name: termcraft-${{ steps.package.outputs.version }}-x86_64-unknown-linux-gnu
          path: candidate
      - name: Prepare rootless Podman on the disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs dbus-user-session
          if ! grep -q "^$(id -un):" /etc/subuid; then
            sudo usermod --add-subuids 500000-565535 "$(id -un)"
          fi
          if ! grep -q "^$(id -un):" /etc/subgid; then
            sudo usermod --add-subgids 500000-565535 "$(id -un)"
          fi
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service" || {
            sudo journalctl -u "user@$(id -u).service" -n 80 --no-pager
            exit 1
          }
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          python -m pip install pillow==12.1.1
      - name: Extract and qualify the shipped server launcher
        run: |
          mkdir sandbox-bundle
          tar -xzf candidate/*.tar.gz --strip-components=1 -C sandbox-bundle
          python scripts/test_sandbox_server.py --bundle sandbox-bundle --report sandbox-qualification.json
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-hosting-qualification-linux
          path: sandbox-qualification.json

  package-payload:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.25.1
      - name: Test package identity and signed repository boundaries
        run: python -m unittest discover -s scripts -p test_distribution.py -v
      - uses: actions/download-artifact@v4
        with:
          pattern: termcraft-*
          path: candidates
      - uses: actions/download-artifact@v4
        with:
          pattern: native-qualification-*
          path: qualifications
      - name: Prepare one version from the four qualified binaries
        run: |
          revision="$(git rev-parse HEAD)"
          tag="v$(python -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['package']['version'])")"
          python scripts/distribution.py prepare --native candidates --output prepared --revision "$revision" --tag "$tag" --qualifications qualifications
      - uses: actions/upload-artifact@v4
        with:
          name: package-manager-candidate
          path: prepared/

  package-managers:
    needs: package-payload
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.25.1
      - uses: actions/download-artifact@v4
        with:
          name: package-manager-candidate
          path: prepared
      - name: Install and exercise package-manager candidate
        run: python scripts/check_distribution.py --prepared prepared --report manager-qualification.json
      - uses: actions/upload-artifact@v4
        with:
          name: manager-qualification-${{ matrix.os }}
          path: manager-qualification.json
