name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - 'beta/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.88.0"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy

      - name: Check formatting
        run: cargo +"$RUST_VERSION" fmt --check

      - name: Check all targets
        run: cargo +"$RUST_VERSION" check --all-targets --locked

      - name: Clippy
        run: cargo +"$RUST_VERSION" clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo +"$RUST_VERSION" test --locked --quiet

      - name: Test local multiplayer over TCP
        run: |
          cargo +"$RUST_VERSION" test --locked --lib temporary_socket -- --ignored
          cargo +"$RUST_VERSION" test --locked --test multiplayer_tcp -- --ignored

      - name: Play Lantern Run through normal CLI tools
        run: python3 scripts/test_lantern_trial.py --binary target/debug/termcraft

      - name: Exercise checkpoint write failures and interrupted commits
        run: |
          cargo +"$RUST_VERSION" build --locked --example storage_review
          python3 scripts/test_storage_recovery.py --binary target/debug/termcraft --fixture target/debug/examples/storage_review

      - name: Test optional world provider adapters (offline)
        run: python3 -m unittest discover -s scripts -p 'test_generate_world.py'

      - name: Test private hosting boundaries
        run: python3 -m unittest discover -s scripts -p 'test_hosting_launcher.py'

      - name: Test release packaging and official WinGet schemas
        run: |
          python3 -m pip install jsonschema==4.25.1
          python3 -m unittest discover -s scripts -p 'test_distribution.py' -v

      - name: Verify package
        run: cargo +"$RUST_VERSION" publish --dry-run --locked
