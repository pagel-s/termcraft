name: Publish Cargo release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source ref for a package dry run (never publishes)
        type: string
        default: main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: '1.88.0'

concurrency:
  group: cargo-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
      revision: ${{ steps.package.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.source_ref || github.ref }}
      - run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - id: package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PYCODE'
          import os,subprocess,tomllib
          version=tomllib.load(open('Cargo.toml','rb'))['package']['version']
          tag=os.environ.get('RELEASE_TAG')
          if tag: assert tag=='v'+version
          revision=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
            output.write('version='+version+'\nrevision='+revision+'\n')
          PYCODE
      - name: Verify Cargo package without publishing
        run: cargo +"$RUST_VERSION" publish --dry-run --locked

  publish:
    needs: verify
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.revision }}
      - run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - id: crates
        name: Check whether this immutable version already exists
        env:
          PACKAGE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' "https://crates.io/api/v1/crates/termcraft/$PACKAGE_VERSION")"
          case "$status" in
            200) echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected crates.io response: $status" >&2; exit 1 ;;
          esac
      - id: auth
        if: steps.crates.outputs.published == 'false'
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish the approved release
        if: steps.crates.outputs.published == 'false'
        run: cargo +"$RUST_VERSION" publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
