[package]
name = "termcraft"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Terminal-based 2D sandbox survival game"
license = "AGPL-3.0-only"
repository = "https://github.com/pagel-s/termcraft"
homepage = "https://pagel-s.github.io/termcraft/"
documentation = "https://pagel-s.github.io/termcraft/"
readme = "README-crates.md"
keywords = ["terminal", "game", "sandbox", "survival", "ascii"]
categories = ["games", "command-line-utilities"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README-crates.md",
    "/src/**",
    "/docs/developer.md",
    "/docs/agents.md",
    "/docs/gameplay.md",
    "/docs/feel-and-art.md",
    "/docs/multiplayer.md",
    "/tests/**",
    "/docs/installation.md",
    "/docs/media-credits.md",
    "/docs/supported-content.md",
    "/docs/world-format.md",
    "/docs/performance.md",
    "/docs/assets/performance-*.json",
    "/docs/distribution.md",
    "/docs/beta-release-notes.md",
    "/examples/**",
    "/scripts/package_release.py",
    "/scripts/release_smoke.sh",
    "/scripts/test_ssh_join.py",
    "/scripts/test_native_archive.py",
    "/scripts/test_lantern_trial.py",
    "/scripts/generate_world.py",
    "/scripts/demo_director.py",
]

[dependencies]
bincode = "1.3.3"
crossterm = { version = "0.29.0", features = ["event-stream", "events"] }
flate2 = "1.0.35"
noise = "0.9.0"
rand = "0.8.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3.18"
