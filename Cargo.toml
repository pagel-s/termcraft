[package]
name = "termcraft"
version = "0.2.0-beta.1"
edition = "2024"
rust-version = "1.88"
description = "Terminal-based 2D sandbox survival game"
license = "AGPL-3.0-only"
repository = "https://github.com/pagel-s/termcraft"
homepage = "https://pagel-s.github.io/termcraft/"
documentation = "https://pagel-s.github.io/termcraft/"
readme = "README-crates.md"
keywords = ["terminal", "game", "sandbox", "survival", "ascii"]
categories = ["games", "command-line-utilities"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/README-crates.md",
    "/RELEASE_NOTES.md",
    "/src/**",
    "/tests/**",
    "/docs/*.md",
    "/docs/assets/termcraft.png",
    "/scripts/*.py",
    "/scripts/*.sh",
    "/scripts/storage_faults.c",
]

# These fixtures are used by terminal and recovery checks in CI.
[[example]]
name = "interaction_review"
path = "tests/support/interaction_review.rs"

[[example]]
name = "encounter_review"
path = "tests/support/encounter_review.rs"

[[example]]
name = "storage_review"
path = "tests/support/storage_review.rs"

[[example]]
name = "village_review"
path = "tests/support/village_review.rs"

[dependencies]
bincode = "1.3.3"
crossterm = { version = "0.29.0", features = ["event-stream", "events"] }
flate2 = "1.0.35"
noise = "0.9.0"
rand = "0.8.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3.18"
